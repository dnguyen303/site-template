name: Deploy to Production

# Set repo variables SITE_NAME and SITE_DOMAIN (Settings > Secrets and variables
# > Actions > Variables), and secrets VPS_HOST and VPS_SSH_KEY. No per-repo edits
# to this file are needed.

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/${{ vars.SITE_NAME }}
            git pull origin main
            bash /opt/${{ vars.SITE_NAME }}/scripts/update.sh

      - name: Post-deploy health check
        run: |
          sleep 5
          curl --fail --silent https://${{ vars.SITE_DOMAIN }}/api/health | grep '"ok":true'
