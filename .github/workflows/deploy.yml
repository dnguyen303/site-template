name: Deploy to Production

# Set repo variables SITE_NAME and SITE_DOMAIN (Settings > Secrets and variables
# > Actions > Variables), and secrets VPS_HOST and VPS_SSH_KEY. No per-repo edits
# to this file are needed. Image path (ghcr.io/<owner>/<repo>) is derived from
# the repo, so it must be lowercase.

on:
  push:
    branches: [main]

# Never let two deploys build/pull on the shared VPS at the same time.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Build the image on GitHub's runners (not the 2GB VPS) and push to GHCR.
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image path
        id: img
        run: echo "path=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.path }}:latest
            ${{ steps.img.outputs.path }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # On the VPS, just pull and run, no build load.
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd /opt/${{ vars.SITE_NAME }}
            git pull origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash /opt/${{ vars.SITE_NAME }}/scripts/update.sh

      - name: Post-deploy health check
        run: |
          sleep 5
          curl --fail --silent https://${{ vars.SITE_DOMAIN }}/api/health | grep '"ok":true'
