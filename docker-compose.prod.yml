services:
  app:
    build: .
    container_name: SITE_CONTAINER_NAME   # replace with e.g. spa-app
    restart: unless-stopped
    mem_limit: 400m
    memswap_limit: 400m
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vethaul-net

networks:
  vethaul-net:
    external: true
    name: vethaul-net
