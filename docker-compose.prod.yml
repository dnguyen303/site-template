services:
  app:
    image: ${IMAGE}            # ghcr.io/<owner>/<repo>:latest, set by scripts/update.sh
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    mem_limit: 400m
    memswap_limit: 400m
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      HOSTNAME: "0.0.0.0"
      # Cap Node's heap so it stays inside mem_limit (Node otherwise sizes its
      # heap to host RAM and can OOM on a shared box). ~256MB heap fits 400m.
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Rotate container logs so a chatty site can't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - appnet

networks:
  appnet:
    external: true
    name: ${DOCKER_NETWORK:-vethaul-net}
